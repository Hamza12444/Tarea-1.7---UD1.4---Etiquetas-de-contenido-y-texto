<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 1.6 - Etiquetas de contenido y texto</title>
</head>
<body>

    <h1>Etiquetas de contenido y texto by Hamza</h1>
        <section id="contenido">
            <h2>Contenido</h2>
            <p>Este es un párrafo de ejemplo.</p>
            <hr>
            <pre>Texto preformateado.</pre>
            <blockquote>Esto es una cita.</blockquote>
            <div>Una caja div.</div>
            <dl>
                <dt>Término</dt>
                <dd>Definición.</dd>
            </dl>

            <figure>
                    <img src="Cuy.jpg" alt="Imagen de ejemplo">
                    <figcaption>Pie de foto</figcaption>

            </figure>
        </section>
</body>
</html>
